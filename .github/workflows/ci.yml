name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ctjs
      NEXT_PUBLIC_WEB_ROOT: http://localhost:3000
      DISCORD_ANNOUNCE_CHANNEL_WEBHOOK: ""
      DISCORD_VERIFY_CHANNEL_WEBHOOK: ""
      JWT_SECRET: ci-only-secret-not-used-in-production
      JWT_COOKIE_NAME: ctjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn exec prisma generate
      - run: yarn test
      - run: yarn exec tsc --noEmit
      - run: yarn build
