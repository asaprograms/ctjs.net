upstream ctjs_net_app {
    server 127.0.0.1:8083;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ctjs.net www.ctjs.net api.ctjs.net downloads.ctjs.net;

    client_max_body_size 25m;

    location / {
        proxy_pass http://ctjs_net_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ctjs.net www.ctjs.net api.ctjs.net downloads.ctjs.net;

    ssl_certificate /etc/letsencrypt/live/ctjs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctjs.net/privkey.pem;
    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://ctjs_net_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }
}
